# 网站基本设置；修改后需要重启本地预览。
locale                   : "en-US"
site_theme               : "default"
title                    : "Ziyi Xie / Personal Page"
title_separator          : "-"
name                     : "Ziyi Xie"
description              : "Ziyi Xie's academic portfolio"
url                      : https://zoeabcd.github.io
baseurl                  : ""
repository               : "academicpages/academicpages.github.io"

# 侧栏个人资料
author:
  avatar: "my_pic.jpg"
  name: "Ziyi Xie/ Zoe Xie/ 谢子怡"
  bio: "PhD Student in Tsinghua University, working on quantum computing and quantum cryptography."
  location: "Beijing, China"
  employer: "Tsinghua University"
  email: "zoezebra369@gmail.com"
  googlescholar: "https://scholar.google.com/citations?hl=zh-CN&user=UdDYfqEAAAAJ"
  orcid: "https://orcid.org/0009-0008-4423-8025"
  github: "zoeabcd"

# 论文分类：论文 front matter 中的 category 对应下面的键。
publication_category:
  underreview:
    title: 'Under Review'
  preprints:
    title: 'Preprints'
  manuscripts:
    title: 'Manuscripts'
  conferences:
    title: 'Conference Paper'

# 页面与 RSS
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
atom_feed:
  hide                   : false
  path                   :

# 保留默认 Person 结构化元数据；分析统计保持关闭。
social: {}
analytics:
  provider: "false"

# 构建输入与排除项
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# 内容集合
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# 各类页面的默认设置
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# 样式
sass:
  sass_dir: _sass
  style: compressed

# 输出网址与时区
permalink: /:categories/:title/
timezone: Etc/UTC

# 插件
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# 分类与标签归档
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML 压缩
compress_html:
  clippings: all
  ignore:
    envs: development
